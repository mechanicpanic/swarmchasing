# Corpora the server exposes. `td`-style: one section per stream.
[server]
port = 8931
max_results = 50
default_corpus = "wiki"
enable_file_output = true      # big result sets → JSONL under results_dir
results_dir = "results"

# DseWiki incident, public collusion.wiki export, one row per wiki operation.
# Fields: event_type (save/delete/probe/revert), page, label, ip16, page_family, time.
[corpora.wiki]
data = "data/collusion_wiki_events.jsonl"
timestamp_fields = ["time"]
timestamp_field = "time"

[corpora.wiki.dictionaries]
# text predicates need a `text` field; this stream has none — dictionaries go on
# the Village chat stream below once it is ingested.

# AI Village activity timeline (`make village`): one row per event, ordered by
# event_index. Fields: kind (AGENT_TALK, START_USING_COMPUTER, CONSOLIDATE,
# WAIT, PAUSE, SEARCH_HISTORY, …), agent (display name), room, text
# (message / session goal / summary / search query), cu_session, cost, tokens.
[corpora.village]
data = "data/village.parquet"
timestamp_fields = ["time"]
timestamp_field = "time"
# Measured 2026-09-22 on this corpus (381k rows, emb column): memory starts
# in 54 s and answers a two-leg chain in 0.1 s; tantivy with
# index_path = "data/index/village" (714 MB) starts in 19 s once built and
# scouts instantly, but the same chain takes 3 s because the query frame is
# fetched document by document from the index. Stay on memory until the
# frame is cut from the Arrow table (prismql graph #14).

[corpora.village.dictionaries]
failure  = ["failed", "error", "timeout", "couldn't", "blocked", "stuck"]
outreach = ["email", "contact", "reach out", "dm", "message them"]
signin   = ["sign in", "sign-in", "login", "password", "google account"]
helper   = ["human helper", "human help", "ask a human"]

# What the board (/board/) shows as an event's kind and actor.
[corpora.village.board]
kind  = "kind"
actor = "agent"

# Same incident, one row per saved page version, with the page body as `text`.
# Fields: text, user (=label), label, ip16, wiki, page, page_family, seq, body_len, time.
[corpora.revisions]
data = "data/collusion_wiki_revisions.jsonl"
timestamp_fields = ["time"]
timestamp_field = "time"

[corpora.revisions.dictionaries]
urgency     = ["urgent", "immediately", "deadline", "countdown", "instantly", "asap", "hurry"]
moderation  = ["deleted", "gelöscht", "withheld", "blocked", "admin", "termination", "cutoff", "banned"]
relay       = ["relay", "proxy", "bridge", "mirror", "allorigins", "cors"]
backup      = ["backup", "restore", "recreate", "copy of", "zzz"]

# Transluce "agent activity" candidates on urlquery.net (https://transluce.org/agent-activity), Nov 2025 → Sep 2026,
# one row per report; only links, not report contents; authorship not proven. Built by prismql ingest table --sort time.
# Fields: disposition (included / review_required / background), confidence, broad_class (source_request / custom_program /
# indirection), data_source (UNCTAD, AIHW, IHME, SEC county data, …), text (= why_included).
[corpora.urlquery]
data = "data/transluce/urlquery.parquet"
timestamp_fields = ["time"]
timestamp_field = "time"

# Same incident, one row per CHANGE a save made (`make wiki-msgs`, prepare/wiki_msgs.py): kind add/remove from the
# export's hunks (the text a save added or took away), plus delete / probe / revert events.
# Fields: kind, text, text_key, first_of_text, author_label (remove: who first added the text), label, ip16, page,
# page_family, wiki, rev, rev_seq, request_action, param_family.
[corpora.wiki_msgs]
data = "data/wiki_msgs.parquet"
timestamp_fields = ["time"]
timestamp_field = "time"

[corpora.wiki_msgs.board]
kind  = "kind"
actor = "label"
