# Corpora the server exposes. `td`-style: one section per stream.
[server]
port = 8931
max_results = 50
default_corpus = "wiki"
enable_file_output = true      # big result sets → JSONL under results_dir
results_dir = "results"

# DseWiki incident, public collusion.wiki export, one row per wiki operation.
# Fields: event_type (save/delete/probe/revert), page, label, ip16, page_family, time.
[corpora.wiki]
data = "data/collusion_wiki_events.jsonl"
timestamp_fields = ["time"]
timestamp_field = "time"

[corpora.wiki.dictionaries]
# text predicates need a `text` field; this stream has none — dictionaries go on
# the Village chat stream below once it is ingested.

# AI Village activity timeline (`make village`): one row per event, ordered by
# event_index. Fields: kind (AGENT_TALK, START_USING_COMPUTER, CONSOLIDATE,
# WAIT, PAUSE, SEARCH_HISTORY, …), agent (display name), room, text
# (message / session goal / summary / search query), cu_session, cost, tokens.
[corpora.village]
data = "data/village.parquet"
timestamp_fields = ["time"]
timestamp_field = "time"

[corpora.village.dictionaries]
failure  = ["failed", "error", "timeout", "couldn't", "blocked", "stuck"]
outreach = ["email", "contact", "reach out", "dm", "message them"]
signin   = ["sign in", "sign-in", "login", "password", "google account"]
helper   = ["human helper", "human help", "ask a human"]

# Same incident, one row per saved page version, with the page body as `text`.
# Fields: text, user (=label), label, ip16, wiki, page, page_family, seq, body_len, time.
[corpora.revisions]
data = "data/collusion_wiki_revisions.jsonl"
timestamp_fields = ["time"]
timestamp_field = "time"

[corpora.revisions.dictionaries]
urgency     = ["urgent", "immediately", "deadline", "countdown", "instantly", "asap", "hurry"]
moderation  = ["deleted", "gelöscht", "withheld", "blocked", "admin", "termination", "cutoff", "banned"]
relay       = ["relay", "proxy", "bridge", "mirror", "allorigins", "cors"]
backup      = ["backup", "restore", "recreate", "copy of", "zzz"]
